[project]
name = "vsc-filesystems"
version = "3.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Georges", email = "itkovian@gmail.com" }
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "vsc-base",
    "vsc-config",
    "vsc-utils",
]


[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsc"]

[project.scripts]


[tool.uv.sources]
vsc-base = { git = "https://github.com/itkovian/vsc-base.git", branch = "uv"}
vsc-config = { git = "ssh://git@github.com/itkovian/vsc-config.git", branch = "uv"}
vsc-utils = { git = "https://github.com/itkovian/vsc-utils.git", branch = "uv"}
